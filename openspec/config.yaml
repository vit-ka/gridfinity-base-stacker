schema: spec-driven

context: |
  A generator, not an application. `stack_plates.py` takes an STL of a Gridfinity
  extended baseplate set -- several plates in one file -- and emits a single solid
  that prints them stacked in one job, separated by gaps a second filament fills.
  `make3mf.py` wraps that in a Bambu Studio project, and `emit_interface.py`
  writes the separating material into the sliced G-code afterwards. Nothing runs
  at print time; everything is decided before the file reaches the printer.

  Python 3, standard library only. No numpy, no trimesh, no mesh kernel: meshes
  are flat tuples of floats and every geometric question is answered by ray
  casting or by rasterising to a grid. That constraint is deliberate and has held
  through the whole project.

  Style is in ~/.claude/CLAUDE.md: frozen dataclasses, immutable types,
  comprehensions over loops, `from __future__ import annotations`, annotated
  signatures.

  Domain, because none of it is guessable from the code:

  - Gridfinity plates are a 42 mm lattice of tapered sockets. The socket is a 45
    degree funnel: 36.14 mm across at the rib face, 40.5 mm at the land face.
    Plates in a set have different cell counts, so a narrower plate's solid
    border can sit squarely over a wider plate's socket -- and those sockets are
    through-holes.
  - Alternate plates are rotated 180 degrees so every interface is land-to-land
    or rib-to-rib, and the lattices are registered onto a common 42 mm grid.
  - The interface prints in a filament meant not to bond to PLA -- Bambu Support
    W, a breakaway support material, or PETG at its own 255 C. Material was not
    the problem: at a real 0.2 mm clearance on both faces both separate by hand,
    and at a nominal 0.1 mm both fused, because the clearance was never printed
    (ADR 0008, ADR 0009).
  - The interface is not a mesh. A mesh is resolved against the slicer's sample
    planes, which quantises its height to the layer and decides ties by float
    rounding that depends on the stack's height. It is emitted as toolpaths
    written into the sliced file instead, so its Z is exact and the clearance
    above and below it are separate numbers.
  - Test on small, fast-printing plates. Two full-size stacks were lost partway
    through and answered nothing about separation.
  - Nothing on the *stack* is supported by the slicer -- a blocker covers it --
    and every overhang is carried by generated geometry, so anything the
    generator misses prints into air. Support is on, for a decoy column beside
    the stack: its gaps are what make the slicer load and purge the interface
    filament at the heights the interface needs.

  How work is judged here: by measurement, not by argument. The Bambu CLI slices
  the real file (`--no-check` is required: an empty gap is an "empty layer" it
  refuses) and the G-code is parsed for what actually happened, by `gcode.py`
  and reported by `verify.py`. Several
  confident conclusions in this repo's history were wrong until measured, and
  several bugs were invisible to the tests but obvious in the slicer preview. A
  change is not done because it looks right.

rules:
  proposal:
    - State how the change will be measured, not only what it will do. Print
      time, material, clearance in mm, support extrusion in mm -- whatever the
      claim rests on.
    - Say what was ruled out and why. This project has repeatedly re-tried
      approaches that were already measured as dead ends.
  tasks:
    - Include verifying against a sliced file, not only against the test suite.
      The suite has passed while the model printed into air.
    - The final task of every change MUST be "Run scripts/codex-gate.sh and
      resolve all reported findings; re-run until clean"

operations:
  apply:
    guidance:
      - After completing all tasks, run scripts/codex-gate.sh. Fix every
        reported finding and re-run until it exits 0. Do not mark the change
        complete otherwise.
  archive:
    guidance:
      - Decisions belong in docs/adr, which predates OpenSpec here and is
        required by ~/.claude/CLAUDE.md. Archive the change, and write or
        supersede an ADR when the change locks in something future work has to
        live with. Do not duplicate the reasoning in both places.
      - Record approaches that measured as no-ops. Two are already in ADR 0005
        precisely so they are not attempted a third time.
